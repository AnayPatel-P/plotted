# Hand review of the UT Austin Computer Science BS (Computer Science Option).
# The scraper parses the program page; this file fills in what it can't read.
# Rule ids like "major.r9" come from the scraped output.
id: ut-cs-bs
name: Computer Science
degree: BS in Computer Science (BSCompSci)
url: https://catalog.utexas.edu/undergraduate/programs/computer-science-computer-science-option-bscompsci/

areas:
  # Overview table "Concentration" rows (the overview table isn't auto-parsed in v0).
  - id: concentration
    label: Concentration (19 hours)
    exclusive: true
    rule:
      type: allOf
      id: concentration
      label: Concentration (19 hours)
      rules:
        - { type: course, id: conc.312, code: C S 312, alternatives: [C S 312H] }
        - type: credits
          id: conc.ud-cs
          label: Upper-division computer science
          hours: 12
          filter: { subjects: [C S], upperDivision: true }
        - type: nOf
          id: conc.science
          label: 3 hours of additional science or upper-division math
          n: 1
          rules:
            - type: credits
              id: conc.science.seq
              label: Additional biology, chemistry, or physics course
              hours: 3
              filter: { subjects: [BIO, CH, PHY] }
            - { type: course, id: conc.science.geo, code: GEO 303 }  # program page also lists GEO 301, which is not in the 2026-28 course catalog
            - type: credits
              id: conc.science.math
              label: Upper-division mathematics (excluding M 325K, 340L, 341, 362K)
              hours: 3
              filter: { subjects: [M], upperDivision: true, exclude: [M 325K, M 340L, M 341, M 362K] }
        - type: nOf
          id: conc.ethics
          label: 1 hour of ethics / contemporary issues
          n: 1
          rules:
            - { type: course, id: conc.ethics.course, code: C S 103F, alternatives: [C S 349] }
            - { type: manual, id: conc.ethics.approved, label: Approved course (see advisor) }

  - id: major
    label: Major requirements (49 hours)
    exclusive: true
    from: Major-Computer Science (BSCompSci)
    replace:
      # Science sequence: the physics option (Sequence 4) has nested PART A / PART B
      # choices that the generic parser can't express.
      major.r9:
        type: nOf
        id: major.science
        label: One natural science sequence
        n: 1
        rules:
          - type: allOf
            id: major.science.bio1
            label: Biology (BIO 311C, 311D)
            rules:
              - { type: course, id: major.science.bio1.a, code: BIO 311C }
              - { type: course, id: major.science.bio1.b, code: BIO 311D }
          - type: allOf
            id: major.science.bio2
            label: Honors genetics (BIO 315H, 325H)
            rules:
              - { type: course, id: major.science.bio2.a, code: BIO 315H }
              - { type: course, id: major.science.bio2.b, code: BIO 325H }
          - type: allOf
            id: major.science.ch
            label: Chemistry (CH 301, 302)
            rules:
              - { type: course, id: major.science.ch.a, code: CH 301, alternatives: [CH 301C] }
              - { type: course, id: major.science.ch.b, code: CH 302, alternatives: [CH 302C] }
          - type: allOf
            id: major.science.phy
            label: Physics (Part A and Part B)
            rules:
              - type: nOf
                id: major.science.phy.a
                label: "Physics Part A: one mechanics course with its lab"
                n: 1
                rules:
                  - type: allOf
                    id: major.science.phy.a1
                    label: PHY 303K + 105M
                    rules:
                      - { type: course, id: phy.a1.1, code: PHY 303K }
                      - { type: course, id: phy.a1.2, code: PHY 105M }
                  - type: allOf
                    id: major.science.phy.a2
                    label: PHY 301 + 101L
                    rules:
                      - { type: course, id: phy.a2.1, code: PHY 301 }
                      - { type: course, id: phy.a2.2, code: PHY 101L }
                  - type: allOf
                    id: major.science.phy.a3
                    label: PHY 317K + 105M
                    rules:
                      - { type: course, id: phy.a3.1, code: PHY 317K }
                      - { type: course, id: phy.a3.2, code: PHY 105M }
              - type: nOf
                id: major.science.phy.b
                label: "Physics Part B: one E&M course with its lab"
                n: 1
                rules:
                  - type: allOf
                    id: major.science.phy.b1
                    label: PHY 303L + 105N
                    rules:
                      - { type: course, id: phy.b1.1, code: PHY 303L }
                      - { type: course, id: phy.b1.2, code: PHY 105N }
                  - type: allOf
                    id: major.science.phy.b2
                    label: PHY 316 + 116L
                    rules:
                      - { type: course, id: phy.b2.1, code: PHY 316 }
                      - { type: course, id: phy.b2.2, code: PHY 116L }
                  - type: allOf
                    id: major.science.phy.b3
                    label: PHY 317L + 105N
                    rules:
                      - { type: course, id: phy.b3.1, code: PHY 317L }
                      - { type: course, id: phy.b3.2, code: PHY 105N }

  - id: degree
    label: Degree requirement (6 hours)
    exclusive: true
    rule:
      type: manual
      id: degree.flc
      label: Foreign language / culture (6 hours)
      note: "One of: beginning proficiency in a foreign language; a first-semester language course plus a culture course in the same area; or two culture courses in one area (approved list)."

  - { include: core.yaml }

  - id: total
    label: Total hours
    exclusive: false
    rule: { type: credits, id: total.hours, label: 120 total hours, hours: 120, filter: { any: true } }

planSlots:
  Foreign Language and Culture: { any: true }
  Math or Science course: { subjects: [M, SDS, BIO, CH, PHY, GEO, AST, NS] }

notes:
  - Grade of at least C- in each math and science course required for the degree; 2.00 GPA in those courses. (not checked)
  - At least 21 hours of upper-division C S coursework must be completed in residence. (not checked)
  - Students in C S Honors and Honors C S + Business are exempt from the foreign language/culture requirement.
  - "Degree area: the foreign language/culture requirement is shown as a manual check; it isn't evaluated automatically in v0."
