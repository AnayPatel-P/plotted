[project]
name = "plotted-scraper"
version = "0.1.0"
description = "Catalog scrapers for Plotted"

authors = [
    { name = "Anay Patel", email = "anay.patel1118@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
plotted-scrape = "plotted_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
